name: 3DS repo watcher

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:         # lets you start it manually with a button

permissions:
  contents: write

concurrency:            # never run two copies at once
  group: watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python watcher.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "Nothing to save"
            exit 0
          fi
          git commit -m "Update state"
          # If someone changed the repo while the watcher was running, merge and retry
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push; then
              exit 0
            fi
            echo "Push failed, retrying ($i/5)..."
            sleep 5
          done
          exit 1
